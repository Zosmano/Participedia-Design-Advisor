# Monthly live refresh: read Participedia's public case index, fetch and score the cases added since the capstone
# snapshot, and republish the advisor (docs/index.html) and its charts. Needs no private data: the model is read
# from outputs/payload.json and country indicators from pdx/live_context.json.
# Runs on the 1st of each month, or by hand (Actions tab > live refresh > Run workflow).
name: live refresh

on:
  schedule:
    - cron: "0 9 1 * *"   # 09:00 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the first run fetches every case's public record (~45 min); later runs only updates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore case records fetched by earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: participedia-raw-${{ github.run_id }}
          restore-keys: participedia-raw-

      - name: Fetch and score new Participedia cases, rebuild the advisor
        run: python run_all.py --refresh

      - name: Keep the fetched records for next time
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: participedia-raw-${{ github.run_id }}

      - name: Publish (GitHub Pages serves the committed docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs outputs/payload.json outputs/live_new_cases_scored.csv outputs/participation_design_advisor.html
          if git diff --cached --quiet; then
            echo "Nothing new on Participedia this month."
          else
            git commit -m "Live refresh: new Participedia cases scored ($(date -u +%Y-%m-%d))"
            git push
          fi
